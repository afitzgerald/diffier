name: Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Unit + integration tests
        run: yarn test

      - name: Build DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: yarn dist -c.buildVersion=$BUILD_NUMBER --publish never

      - name: Prune old artifacts (keep last 2 successful builds)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts --paginate \
            --jq '.artifacts[] | select(.name=="Diffier-dmg") | [.id, .workflow_run.id, .created_at] | @tsv' \
            | while IFS=$'\t' read -r id run_id created; do
                conclusion=$(gh api repos/${{ github.repository }}/actions/runs/$run_id --jq '.conclusion')
                [ "$conclusion" = "success" ] && printf '%s\t%s\n' "$id" "$created"
              done \
            | sort -k2 -r | tail -n +2 | cut -f1 \
            | xargs -I{} gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/{}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Diffier-dmg
          path: dist/*.dmg
