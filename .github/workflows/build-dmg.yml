name: Build macOS DMG

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: yarn dist -c.buildVersion=$BUILD_NUMBER --publish never

      - name: Prune old artifacts (keep last 2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts --paginate \
            --jq '.artifacts[] | select(.name=="Diffier-dmg") | [.id, .created_at] | @tsv' \
            | sort -k2 -r | tail -n +2 | cut -f1 \
            | xargs -I{} gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/{}

      - uses: actions/upload-artifact@v4
        with:
          name: Diffier-dmg
          path: dist/*.dmg
