# How `gh release create --generate-notes` (the Release workflow's "Ensure
# GitHub release exists" step) groups merged PRs. Each PR's title is its line
# in the release notes, both on GitHub and in the app's What's New dialog; its
# label decides the heading. See "Pull requests are release notes" in CLAUDE.md.
changelog:
  exclude:
    labels:
      - internal
      - documentation
  categories:
    - title: New
      labels:
        - enhancement
    - title: Fixed
      labels:
        - bug
    - title: Other changes
      labels:
        - "*"
